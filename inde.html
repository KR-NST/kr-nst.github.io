<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARBLE ROYALE - 마블 룰렛</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:#fff4d2;
  font-family:Arial,sans-serif;text-align:center;
  background:radial-gradient(ellipse at top,#29376b,#0a0d1b 65%);
}
main{width:min(940px,94%);margin:auto;padding:28px 0}
.eyebrow{color:#ffd875;letter-spacing:5px;font-size:12px}
h1{font-size:clamp(30px,6vw,52px);color:#ffd875;
text-shadow:0 0 25px #ffbb4770;margin:12px 0}
p{color:#bfc9e8}
.machine{
  background:linear-gradient(145deg,#242c4b,#090e1e);
  border:2px solid #d7b85e;border-radius:24px;padding:12px;
  box-shadow:0 0 35px #e8b94625;
}
.machine-title{display:flex;justify-content:space-between;
color:#ffda83;font-size:11px;letter-spacing:2px;padding:5px 4px 12px}
canvas{display:block;width:100%;height:auto;border-radius:15px;
background:#080d20;border:1px solid #8f814b}
#status{min-height:55px;display:grid;place-items:center;
font-size:16px;padding:10px}
#status strong{color:#ffd875;font-size:24px}
.controls{display:grid;grid-template-columns:1fr 1fr;
gap:12px;margin-top:14px}
.panel{background:#ffffff0a;border:1px solid #ffffff20;
border-radius:14px;padding:16px;text-align:left}
label{display:block;font-size:13px;color:#c6d0e9;margin-bottom:10px}
select,button{width:100%;padding:14px;border-radius:10px;font-size:15px}
select{background:#171e35;color:white;border:1px solid #d6b75c}
button{border:0;font-weight:bold;cursor:pointer}
#spin{background:linear-gradient(110deg,#fff0b0,#ffb72f,#ffe69a);
color:#382407;align-self:end;box-shadow:0 4px 18px #ffba3640}
button:disabled{opacity:.6;cursor:wait}
.history{margin-top:13px;background:#ffffff08;
border:1px solid #ffffff1b;border-radius:14px;padding:15px;text-align:left}
.history h3{font-size:12px;color:#c4cee7;margin:0 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{font-size:12px;border:1px solid #ffffff25;background:#ffffff0c;
border-radius:20px;padding:7px 10px;color:#e4e9ff}
.tag.winner{background:#ffd875;color:#201605;border-color:#ffd875;font-weight:bold}
footer{font-size:11px;color:#7783a4;line-height:1.8;margin-top:20px}
@media(max-width:520px){.controls{grid-template-columns:1fr}
main{padding-top:20px}.machine{padding:8px}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">★ THE ULTIMATE MARBLE GAME ★</div>
  <h1>MARBLE ROYALE</h1>
  <p>행운의 구슬 하나를 찾아라!</p>

  <section class="machine">
    <div class="machine-title">
      <span>ROYAL CHAMBER</span>
      <span id="state">● READY</span>
    </div>
    <canvas id="game" width="760" height="460"></canvas>
    <div id="status" aria-live="polite">구슬 개수를 선택하고 시작하세요!</div>
  </section>

  <div class="controls">
    <div class="panel">
      <label for="count">추첨할 구슬 개수</label>
      <select id="count">
        <option value="5">5개</option>
        <option value="8" selected>8개</option>
        <option value="10">10개</option>
        <option value="12">12개</option>
        <option value="16">16개</option>
        <option value="20">20개</option>
      </select>
    </div>
    <button id="spin">🎰 룰렛 START</button>
  </div>

  <section class="history">
    <h3>현재 구슬</h3>
    <div class="tags" id="current"></div>
  </section>

  <section class="history">
    <h3>당첨 기록</h3>
    <div class="tags" id="records"><span class="tag">아직 기록이 없습니다.</span></div>
  </section>

  <footer>MARBLE ROYALE · JUST FOR FUN<br>
  무작위 번호 추첨 게임</footer>
</main>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=760,H=460;
const count=document.getElementById("count");
const spin=document.getElementById("spin");
const status=document.getElementById("status");
const state=document.getElementById("state");
const current=document.getElementById("current");
const records=document.getElementById("records");

const palette=[
 "#ff4e70","#36d9ff","#ffd447","#a879ff",
 "#5dffb0","#ff963d","#f5f5ff","#ff65e8",
 "#80a7ff","#ff7555","#d4ff5c","#53f1d5",
 "#fca6ff","#e8bd87","#8cf0ff","#ffcfef",
 "#b9ff83","#f8a45d","#a5aaff","#fff07d"
];

let balls=[];
let running=false;
let winner=0;
let started=0;
let last=0;
let elapsed=0;
let results=[];

function random(a,b){return Math.random()*(b-a)+a}

function setup(){
  const n=Number(count.value);
  winner=0;
  balls=[];
  const r=n>=16?11:n>=10?13:15;

  for(let i=1;i<=n;i++){
    balls.push({
      id:i,x:random(100,660),y:random(90,300),
      vx:random(-2,2),vy:random(-1,1),
      r,color:palette[(i-1)%palette.length],
      phase:random(0,7)
    });
  }
  renderTags();
  draw();
}

function renderTags(){
  current.innerHTML="";
  balls.forEach(b=>{
    const el=document.createElement("span");
    el.className="tag"+(winner===b.id?" winner":"");
    el.textContent="● 구슬 "+b.id;
    el.style.borderColor=winner===b.id?"#ffd875":b.color+"88";
    current.appendChild(el);
  });
}

function background(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#19294e");
  g.addColorStop(1,"#080c1a");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<65;i++){
    ctx.fillStyle=i%3===0?"#ffd87566":"#d8e6ff35";
    ctx.beginPath();
    ctx.arc((i*139+23)%W,(i*83+13)%H,i%5===0?1.7:1,0,Math.PI*2);
    ctx.fill();
  }

  ctx.save();
  ctx.shadowColor="#ffc94f";
  ctx.shadowBlur=18;
  ctx.strokeStyle="#d9b45e";
  ctx.lineWidth=7;
  ctx.beginPath();
  ctx.ellipse(W/2,H/2+8,W*.445,H*.405,0,0,Math.PI*2);
  ctx.stroke();
  ctx.shadowBlur=0;
  ctx.strokeStyle="#fff0b8";
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle="#ffffff22";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.ellipse(W*.38,H*.23,W*.23,H*.07,-.2,Math.PI,Math.PI*2);
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle="#050916aa";
  ctx.beginPath();
  ctx.ellipse(W/2,H*.81,W*.37,H*.07,0,0,Math.PI*2);
  ctx.fill();
}

function drawBall(b){
  const r=b.r;
  const x=b.x;
  const y=b.y+(running?Math.sin(elapsed*.009+b.phase):0);

  ctx.fillStyle="#0007";
  ctx.beginPath();
  ctx.ellipse(x+3,y+r*.7,r,r*.4,0,0,Math.PI*2);
  ctx.fill();

  const g=ctx.createRadialGradient(
    x-r*.35,y-r*.4,r*.05,x,y,r*1.15
  );
  g.addColorStop(0,"#ffffff");
  g.addColorStop(.18,b.color);
  g.addColorStop(.75,b.color);
  g.addColorStop(1,"#17162a");

  ctx.save();
  ctx.shadowColor=b.color;
  ctx.shadowBlur=winner===b.id?28:10;
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.lineWidth=winner===b.id?3:1;
  ctx.strokeStyle=winner===b.id?"#fff5ad":"#ffffff99";
  ctx.stroke();

  ctx.fillStyle="#ffffffbb";
  ctx.beginPath();
  ctx.ellipse(x-r*.28,y-r*.35,r*.27,r*.14,-.5,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.font="bold "+Math.max(9,r*.85)+"px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.shadowColor="#000";
  ctx.shadowBlur=3;
  ctx.fillText(b.id,x,y+1);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  background();
  balls.forEach(drawBall);

  if(winner){
    const b=balls.find(x=>x.id===winner);
    if(b){
      ctx.save();
      ctx.strokeStyle="#ffe79a";
      ctx.lineWidth=3;
      ctx.setLineDash([5,6]);
      ctx.beginPath();
      ctx.arc(b.x,b.y,b.r+10,0,Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
  }
}

function update(dt){
  const f=Math.min(dt/16.67,2);
  const left=W*.075,right=W*.925;
  const top=H*.14,bottom=H*.84;

  balls.forEach((b,i)=>{
    b.x+=b.vx*f;
    b.y+=b.vy*f;
    b.vy+=.045*f;
    b.vx+=random(-.12,.12)*f;

    if(b.x<left+b.r){b.x=left+b.r;b.vx=Math.abs(b.vx)*.9}
    if(b.x>right-b.r){b.x=right-b.r;b.vx=-Math.abs(b.vx)*.9}
    if(b.y<top+b.r){b.y=top+b.r;b.vy=Math.abs(b.vy)*.9}
    if(b.y>bottom-b.r){b.y=bottom-b.r;b.vy=-Math.abs(b.vy)*.83}

    for(let j=i+1;j<balls.length;j++){
      const o=balls[j];
      const dx=o.x-b.x,dy=o.y-b.y;
      const d=Math.hypot(dx,dy)||.01;
      const min=b.r+o.r;

      if(d<min){
        const nx=dx/d,ny=dy/d;
        const overlap=(min-d)/2;
        b.x-=nx*overlap;b.y-=ny*overlap;
        o.x+=nx*overlap;o.y+=ny*overlap;

        const rel=(b.vx-o.vx)*nx+(b.vy-o.vy)*ny;
        if(rel>0){
          b.vx-=rel*nx*.88;b.vy-=rel*ny*.88;
          o.vx+=rel*nx*.88;o.vy+=rel*ny*.88;
        }
      }
    }
  });
}

function finish(){
  running=false;
  const chosen=balls[Math.floor(Math.random()*balls.length)];
  winner=chosen.id;

  balls.forEach(b=>{
    if(b.id===winner){
      b.x=W/2;b.y=H*.48;b.vx=0;b.vy=0;
    }else{
      const dx=b.x-W/2,dy=b.y-H*.48;
      const d=Math.hypot(dx,dy)||1;
      if(d<48){b.x+=dx/d*48;b.y+=dy/d*48}
      b.x=Math.max(W*.08+b.r,Math.min(W*.92-b.r,b.x));
      b.y=Math.max(H*.14+b.r,Math.min(H*.84-b.r,b.y));
    }
  });

  state.textContent="★ WINNER";
  status.innerHTML="🏆 당첨 구슬 <strong>NO. "+winner+"</strong>!";
  results.unshift(winner);
  results=results.slice(0,10);
  records.innerHTML="";
  results.forEach((id,i)=>{
    const tag=document.createElement("span");
    tag.className="tag"+(i===0?" winner":"");
    tag.textContent="#"+id;
    records.appendChild(tag);
  });

  renderTags();
  spin.disabled=false;
  spin.textContent="🔄 다시 돌리기";
  draw();
}

function animate(now){
  const dt=last?Math.min(now-last,34):16;
  last=now;
  elapsed=now;

  if(running){
    update(dt);
    if(now-started>=4500)finish();
  }
  draw();
  requestAnimationFrame(animate);
}

spin.addEventListener("click",()=>{
  if(running)return;
  if(balls.length!==Number(count.value))setup();

  winner=0;
  running=true;
  started=performance.now();
  state.textContent="● SPINNING";
  status.textContent="구슬들이 굴러갑니다... 행운의 주인공은?";
  spin.disabled=true;
  spin.textContent="✨ 추첨 진행 중...";

  balls.forEach(b=>{
    b.vx=random(-5.5,5.5);
    b.vy=random(-5,1);
  });
  renderTags();
});

count.addEventListener("change",()=>{
  if(running)return;
  setup();
  state.textContent="● READY";
  status.textContent="구슬 개수가 변경되었습니다. 시작하세요!";
});

setup();
requestAnimationFrame(animate);
</script>
</body>
</html>
