<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마블 룰렛 - 랜덤 추첨기</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#222;font:14px Arial,"Malgun Gothic",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{padding:12px 18px;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:20px;margin:0;font-weight:600}
.wrap{max-width:1100px;margin:auto;padding:14px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
button,select,input{border:1px solid #ccc;border-radius:4px;background:#fff;padding:8px}
button:hover{background:#f0f0f0}
.primary{background:#3a9e65;color:white;border-color:#328856}
.primary:hover{background:#308b56}
.panel{border:1px solid #ddd;border-radius:5px;margin-bottom:12px;background:#fff}
.panel-title{padding:10px 12px;background:#f6f6f6;border-bottom:1px solid #ddd;font-weight:bold}
.panel-body{padding:12px}
.settings-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field label{display:block;font-size:12px;color:#666;margin-bottom:5px}
.field input,.field select{width:100%;min-width:0}
.maparea{height:310px;position:relative;overflow:hidden;background:#f4f4f4;border:1px solid #ddd}
canvas{display:block;width:100%;height:100%}
.maplabel{position:absolute;top:10px;left:10px;color:#555;background:#ffffffd9;padding:5px 8px;border-radius:3px}
.bottom-grid{display:grid;grid-template-columns:1fr 280px;gap:12px}
textarea{width:100%;height:190px;padding:10px;resize:vertical;border:1px solid #ccc;border-radius:4px;line-height:1.7}
.hint{font-size:12px;color:#777;line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input{min-width:0;flex:1}
.result{padding:15px;text-align:center;background:#fafafa;border:1px solid #eee;margin:12px 0;font-size:18px;min-height:53px}
.result strong{color:#21874d}
.notice{font-size:13px;line-height:1.8;color:#555}
footer{text-align:center;padding:24px;color:#888;font-size:12px}
.hidden{display:none!important}
@media(max-width:700px){
 .settings-grid{grid-template-columns:1fr 1fr}
 .bottom-grid{grid-template-columns:1fr}
 header{align-items:flex-start;flex-direction:column}
 .maparea{height:260px}
}
@media(max-width:420px){.settings-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>🔵 Marble Roulette 마블 룰렛</h1>
  <button id="settingsToggle">Settings ▲</button>
</header>

<main class="wrap">
  <section class="panel" id="settingsPanel">
    <div class="panel-title">Settings</div>
    <div class="panel-body">
      <div class="settings-grid">
        <div class="field">
          <label>맵 선택</label>
          <select id="mapSelect">
            <option value="classic">Classic</option>
            <option value="wide">Wide Map</option>
            <option value="circle">Circle Map</option>
          </select>
        </div>
        <div class="field">
          <label>Recording</label>
          <select id="recording">
            <option value="yes">기록 사용</option>
            <option value="no">기록 안 함</option>
          </select>
        </div>
        <div class="field">
          <label>Using skills</label>
          <select id="skills">
            <option value="yes">사용</option>
            <option value="no">사용 안 함</option>
          </select>
        </div>
        <div class="field">
          <label>당첨 방식</label>
          <select id="winnerMode">
            <option value="first">First - 첫 번째</option>
            <option value="last">Last - 마지막</option>
            <option value="multiple">Multiple - 여러 명</option>
          </select>
        </div>
        <div class="field">
          <label>당첨 인원 (Multiple)</label>
          <input id="winnerCount" type="number" value="2" min="1" max="50">
        </div>
        <div class="field">
          <label>추첨 속도</label>
          <select id="speed">
            <option value="1">보통</option>
            <option value="0.65">빠르게</option>
            <option value="1.6">느리게</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">Map</div>
    <div class="maparea">
      <canvas id="game" width="1000" height="430"></canvas>
      <div class="maplabel" id="mapLabel">Classic Map</div>
    </div>
    <div class="panel-body">
      <div class="row">
        <button id="shuffle">Shuffle</button>
        <button class="primary" id="start">▶ Start</button>
        <button id="reset">Reset</button>
        <span class="hint" id="state">준비 완료</span>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">Winner</div>
    <div class="panel-body">
      <div class="row">
        <button id="firstBtn">First</button>
        <button id="lastBtn">Last</button>
        <input id="winnerInput" placeholder="당첨자" readonly>
        <button id="multipleBtn">Multiple</button>
      </div>
      <div class="row" style="margin-top:9px">
        <input id="minRange" type="number" placeholder="최소 번호" value="1">
        <span>~</span>
        <input id="maxRange" type="number" placeholder="최대 번호" value="8">
        <button id="rangeApply">번호 적용</button>
      </div>
      <div class="result" id="result">Enter names below</div>
    </div>
  </section>

  <div class="bottom-grid">
    <section class="panel">
      <div class="panel-title">Enter names below</div>
      <div class="panel-body">
        <textarea id="names" spellcheck="false">수박*2
키위*2
귤*2
사과
포도
딸기</textarea>
        <p class="hint">한 줄에 한 항목씩 입력하세요. 수박*2처럼 입력하면 해당 항목을 두 번 참가시킵니다.</p>
        <div class="row">
          <button class="primary" id="applyNames">항목 적용</button>
          <button id="removeWinner">당첨 항목 제거</button>
          <button id="clearHistory">기록 지우기</button>
        </div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-title">Recording / 추첨 기록</div>
      <div class="panel-body">
        <div id="history" class="notice">아직 기록이 없습니다.</div>
      </div>
    </section>
  </div>

  <section class="panel">
    <div class="panel-title">Notice</div>
    <div class="panel-body notice">
      이름을 입력하고 Start를 눌러 추첨하세요.<br>
      맵은 이 예제에서 제공하는 기본 맵으로 동작합니다.
    </div>
  </section>
</main>
<footer>Marble Roulette · 개인용 랜덤 추첨기</footer>

<script>
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d");
const palette=["#ef5350","#42a5f5","#ffca28","#66bb6a",
"#ab47bc","#ff7043","#26a69a","#ec407a","#7e8ce0","#b0bec5"];
let entries=[],marbles=[],history=[],busy=false,lastWinners=[];
let raf=0,started=0,duration=4500;
let mode="first",mapType="classic";

function parseEntries(){
  const lines=$("names").value.split(/\n|,/).map(s=>s.trim()).filter(Boolean);
  const list=[];
  for(const line of lines){
    const match=line.match(/^(.*?)\s*\*\s*(\d+)$/);
    if(match){
      const name=match[1].trim(),n=Math.min(100,Math.max(1,Number(match[2])));
      for(let i=0;i<n;i++)list.push(name);
    }else list.push(line);
  }
  return list;
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function setup(){
  if(busy)return;
  entries=parseEntries();
  if(entries.length<2){
    alert("항목을 두 개 이상 입력하세요.");
    return;
  }
  marbles=entries.map((name,i)=>({
    name,id:i,x:100+(i%8)*110,y:75+Math.floor(i/8)*70,
    vx:0,vy:0,r:17,color:palette[i%palette.length]
  }));
  $("state").textContent=entries.length+"개 항목 준비 완료";
  $("winnerInput").value="";
  $("result").textContent="Enter names below";
  draw();
}
function draw(){
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="#f5f5f5";ctx.fillRect(0,0,w,h);

  if(mapType==="circle"){
    ctx.strokeStyle="#bbb";ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(w/2,h/2,Math.min(w,h)*.38,0,Math.PI*2);ctx.stroke();
  }else{
    ctx.strokeStyle="#ddd";ctx.lineWidth=2;
    for(let x=0;x<w;x+=50){
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();
    }
  }
  ctx.strokeStyle="#bbb";ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(20,h-35);ctx.lineTo(w-20,h-35);ctx.stroke();

  marbles.forEach((b,i)=>{
    ctx.save();
    ctx.shadowColor=b.color;ctx.shadowBlur=busy?12:4;
    const g=ctx.createRadialGradient(b.x-6,b.y-7,2,b.x,b.y,b.r);
    g.addColorStop(0,"#fff");g.addColorStop(.22,b.color);g.addColorStop(1,"#333");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle="#222";ctx.font="bold 11px Arial";
    ctx.textAlign="center";ctx.textBaseline="middle";
    let label=b.name;
    if(label.length>7)label=label.slice(0,6)+"…";
    ctx.fillText(label,b.x,b.y+b.r+13);
    ctx.restore();
  });
}
function animate(now){
  if(!busy)return;
  const t=Math.min(1,(now-started)/duration);
  marbles.forEach((b,i)=>{
    if(mapType==="circle"){
      const a=(i/marbles.length)*Math.PI*2+now*.004;
      const rad=70+(i%4)*35;
      b.x=canvas.width/2+Math.cos(a)*rad;
      b.y=canvas.height/2+Math.sin(a)*rad;
    }else{
      b.x+=b.vx*(1-t*.9);
      b.y+=b.vy*(1-t*.9);
      if(b.x<25||b.x>canvas.width-25)b.vx*=-1;
      if(b.y<25||b.y>canvas.height-55)b.vy*=-1;
    }
  });
  draw();
  if(t<1){
    raf=requestAnimationFrame(animate);
  }else finish();
}
function start(){
  if(busy)return;
  if(entries.length<2)setup();
  if(entries.length<2)return;

  busy=true;
  $("start").disabled=true;
  $("state").textContent="추첨 진행 중...";
  $("result").textContent="구슬이 움직이고 있습니다...";
  duration=4500*Number($("speed").value);
  started=performance.now();
  marbles.forEach(b=>{
    b.vx=(Math.random()-.5)*13;
    b.vy=(Math.random()-.5)*9;
  });
  raf=requestAnimationFrame(animate);
}
function finish(){
  busy=false;
  $("start").disabled=false;

  let n=1;
  if(mode==="multiple")n=Math.min(entries.length,Math.max(1,Number($("winnerCount").value)||2));
  const pool=shuffle([...entries]);
  lastWinners=pool.slice(0,n);
  $("winnerInput").value=lastWinners.join(", ");
  $("result").textContent="🏆 당첨: "+lastWinners.join(", ");
  $("state").textContent="추첨 완료";

  if($("recording").value==="yes"){
    history.unshift(...lastWinners.map(name=>({name,time:new Date().toLocaleTimeString()})));
    history=history.slice(0,50);
    renderHistory();
  }

  // 결과 표시를 위해 구슬을 아래쪽 결승선 주변에 배치
  marbles.forEach((b,i)=>{
    b.x=55+(i%12)*80;
    b.y=80+Math.floor(i/12)*75;
  });
  draw();
}
function renderHistory(){
  const box=$("history");
  box.replaceChildren();
  if(!history.length){box.textContent="아직 기록이 없습니다.";return;}
  history.forEach((h,i)=>{
    const div=document.createElement("div");
    div.textContent=(history.length-i)+". "+h.name+" · "+h.time;
    box.appendChild(div);
  });
}
$("settingsToggle").onclick=()=>{
  const p=$("settingsPanel");
  p.classList.toggle("hidden");
  $("settingsToggle").textContent=p.classList.contains("hidden")?"Settings ▼":"Settings ▲";
};
$("applyNames").onclick=setup;
$("shuffle").onclick=()=>{
  if(busy)return;
  const lines=shuffle(parseEntries());
  $("names").value=lines.join("\n");
  setup();
};
$("start").onclick=start;
$("reset").onclick=()=>{
  if(busy){cancelAnimationFrame(raf);busy=false;$("start").disabled=false;}
  setup();
};
$("firstBtn").onclick=()=>{mode="first";$("winnerInput").value="";$("result").textContent="First 모드 선택";};
$("lastBtn").onclick=()=>{mode="last";$("winnerInput").value="";$("result").textContent="Last 모드 선택";};
$("multipleBtn").onclick=()=>{mode="multiple";$("result").textContent="Multiple 모드 선택";};
$("rangeApply").onclick=()=>{
  if(busy)return;
  const min=Math.floor(Number($("minRange").value));
  const max=Math.floor(Number($("maxRange").value));
  if(!Number.isFinite(min)||!Number.isFinite(max)||max<min){
    alert("올바른 번호 범위를 입력하세요.");return;
  }
  $("names").value=Array.from({length:Math.min(500,max-min+1)},(_,i)=>String(min+i)).join("\n");
  setup();
};
$("removeWinner").onclick=()=>{
  if(busy||!lastWinners.length)return;
  const removed=new Set(lastWinners);
  let toRemove=[...removed];
  let list=parseEntries();
  toRemove.forEach(name=>{
    const i=list.indexOf(name);
    if(i>=0)list.splice(i,1);
  });
  $("names").value=list.join("\n");
  lastWinners=[];
  setup();
};
$("clearHistory").onclick=()=>{history=[];renderHistory();};
$("mapSelect").onchange=()=>{
  mapType=$("mapSelect").value==="circle"?"circle":"classic";
  $("mapLabel").textContent=$("mapSelect").selectedOptions[0].text+" Map";
  setup();
};
$("recording").onchange=()=>{};
$("skills").onchange=()=>{};
$("winnerMode").onchange=()=>{
  mode=$("winnerMode").value;
};
setup();
</script>
</body>
</html>
