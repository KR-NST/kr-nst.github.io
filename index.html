<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 웹사이트</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5ff;
      color: #222;
      text-align: center;
    }
    header {
      background: #3346a8;
      color: white;
      padding: 35px 15px;
    }
    main {
      max-width: 650px;
      margin: 45px auto;
      padding: 25px;
    }
    .card {
      background: white;
      padding: 30px;
      margin: 20px 0;
      border-radius: 16px;
      box-shadow: 0 4px 15px #0001;
    }
    a {
      color: #3346a8;
    }
  </style>
</head>
<body>
  <header>
    <h1>나의 웹사이트</h1>
    <p>나만의 공간에 오신 것을 환영합니다!</p>
  </header>

  <main>
    <div class="card">
      <h2>사이트 소개</h2>
      <p>이곳에 웹사이트에 대한 소개를 작성하세요.</p>
    </div>

    <div class="card">
      <h2>나의 첫 번째 콘텐츠</h2>
      <p>사진, 글, 링크 등 원하는 내용을 추가할 수 있습니다.</p>
      <a href="https://github.com/">GitHub 바로가기</a>
    </div>
  </main>
</body>
</html>
